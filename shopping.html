<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bill</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="0">
        <caption><strong>Shopping Bill</strong></caption>
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price(&#8377;)</th>
                <th>Amount(&#8377;)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>2</td>
                <td>50</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Pen</td>
                <td>5</td>
                <td>10</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Book</td>
                <td>1</td>
                <td>200</td>
                <td>200</td>
            </tr>
             <tr>
                <td>Bag</td>
                <td>1</td>
                <td>500</td>
                <td>500</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3"><center>Total </center></th>
                <th>850</th>
            </tr>
        </tfoot>
</body>
</html>
